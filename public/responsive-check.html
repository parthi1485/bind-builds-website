<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Temporary responsive verification</title><style>body{font:16px Arial;margin:20px;background:#ddd}label{margin-right:20px}select{padding:10px}iframe{display:block;border:1px solid #777;margin-top:20px;background:#fff}header{position:sticky;top:0;padding:15px;background:white;z-index:2}</style><header><label>Viewport <select id="width"><option>320</option><option selected>390</option><option>768</option><option>1024</option><option>1440</option><option>1920</option></select></label><label>Page <select id="route"><option value="/">Home</option><option value="/faq">FAQ</option><option value="/packages">Packages</option><option value="/start-a-project">Enquiry</option><option value="/about">About</option><option value="/process">Process</option><option value="/projects">Projects</option><option value="/contact">Contact</option></select></label></header><iframe id="frame" title="Responsive website" src="/" width="390" height="844"></iframe><script>const frame=document.getElementById('frame');document.getElementById('width').addEventListener('change',e=>{frame.width=e.target.value;frame.height=Number(e.target.value)<768?844:1000});document.getElementById('route').addEventListener('change',e=>{frame.src=e.target.value});</script></html>
