<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Bind Builds — mobile width QA</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9edf2;color:#172331;font:14px/1.5 system-ui}header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:14px 24px;background:#fff;border-bottom:1px solid #c5cfdb}h1{font-size:16px;margin:0}label{display:flex;align-items:center;gap:8px}select{font:inherit;padding:8px;border:1px solid #66768a;border-radius:6px}output{font-variant-numeric:tabular-nums}main{padding:24px;min-width:max-content}.device{width:max-content;margin:0 auto;padding:0;background:#fff;box-shadow:0 6px 36px #17233122}iframe{display:block;border:0;width:375px;height:844px;background:white}p{margin:14px 24px;color:#46576b}
</style></head><body><header><h1>Bind Builds / responsive QA</h1><label>Width <select id="width"><option>320</option><option selected>375</option><option>430</option><option>768</option></select></label><label>Page <select id="route"><option value="/">Home</option><option value="/packages">Packages</option><option value="/cost-calculator">Calculator</option><option value="/start-a-project">Project brief</option></select></label><output id="size"></output></header><main><div class="device"><iframe id="preview" title="Mobile website preview"></iframe></div></main><p>Same application source as production release f9939bf. Exact CSS-width iframe testing in Chromium; physical-device Safari and Android checks are separate.</p><script>
const widths=[320,375,430,768],routes=['/','/packages','/cost-calculator','/start-a-project'];
const params=new URLSearchParams(location.search),width=document.querySelector('#width'),route=document.querySelector('#route'),frame=document.querySelector('#preview');
if(widths.includes(Number(params.get('width'))))width.value=params.get('width');
if(routes.includes(params.get('path')))route.value=params.get('path');
try{sessionStorage.setItem('bindbuilds_lead_popup_shown_session_v1','1')}catch{}
function size(){frame.style.width=width.value+'px';document.querySelector('#size').textContent=width.value+' × 844 CSS px'}
width.addEventListener('change',size);route.addEventListener('change',()=>{frame.src=route.value});size();frame.src=route.value;
</script></body></html>
